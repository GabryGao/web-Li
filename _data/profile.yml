tagline: "Trustworthy AI, LLM/Agentic AI Security, AI for Security."
affiliation: "Department of Data Science and Artificial Intelligence, The Hong Kong Polytechnic University"

career:
  - "Dr. Xinfeng Li is a tenure-track Assistant Professor in the Department of Data Science and Artificial Intelligence at The Hong Kong Polytechnic University."
  - "Before joining PolyU, he was a Research Fellow in the College of Computing and Data Science at Nanyang Technological University, working with Prof. XiaoFeng Wang and Prof. Wei Dong."
  - "He received his Ph.D. and B.Eng. degrees from Zhejiang University. His doctoral research was co-supervised by Prof. Wenyuan Xu, Prof. Xiaoyu Ji, and Prof. Chen Yan."

about:
  - "Dr. Li studies security and privacy in artificial intelligence, with a particular focus on multimodal large language models and agentic AI systems."
  - "His research examines how AI systems interact with people, software, and the physical world, and how those interactions can be made more robust, responsible, and trustworthy."
  - "Current directions include agentic AI security, responsible AI in social contexts, and trustworthy AI applications in areas such as healthcare, power grids, software engineering, IoT, and telecommunications."

