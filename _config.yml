links:
  google_scholar: "https://scholar.google.com/citations?view_op=list_works&hl=en&user=JC_UWyoAAAAJ"
  github: ""
  researchgate: "https://www.researchgate.net/profile/Xinfeng-Li-7"
  orcid: ""
  twitter: ""
  linkedin: ""
  cv: ""
  email_alt: "lxfmakeit@gmail.com"

# ============================================================
# STEP 3: Site Settings
# ============================================================
accent_color: "#7C3AED"
dark_mode: true
description: "Xinfeng Li — AI Security and Privacy, Trustworthy AI, Multimodal LLMs & Agentic AI Safety. Assistant Professor at The Hong Kong Polytechnic University."
baseurl: "/web-Li"
url: "https://GabryGao.github.io"
lab_tagline: "Trustworthy AI, LLM/Agentic AI Security, AI for Security."

analytics:
  google_id: ""

# ============================================================
# STEP 4: Choose Your Pages (comment out any you don't need)
# ============================================================
nav_pages:
  - name: about
  - name: research
  - name: publications
  - name: news
  - name: team

# ============================================================
# Advanced Settings (you probably don't need to change these)
# ============================================================
include:
  - .htaccess
  - _pages

sass:
  quiet_deps: true
  style: compressed

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true

plugins: ["jekyll/scholar", "jekyll-sitemap"]

scholar:
  last_name: Li
  first_name: [Xinfeng]
  style: citesty
  locale: en
  source: /assets/
  bibliography: ref.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending
  replace_strings: true
  join_strings: true
  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details
  query: "@*"
  bibliography_list_attributes:
    reversed: "reversed"

exclude:
  - Gemfile
  - Gemfile.lock
  - update_bootstrap.sh
  - switch_theme.sh
  - tags
  - Rakefile
  - node_modules
  - package.json
  - package-lock.json
  - docs
